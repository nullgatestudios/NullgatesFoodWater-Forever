<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nullgate's Food & Water - Forever: a conjured baguette and a water drop, joined by arcane sparkles -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b866"/>
      <stop offset="1" stop-color="#b8692a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe2ff"/>
      <stop offset="1" stop-color="#1f7fd6"/>
    </linearGradient>
    <radialGradient id="arcane" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c79bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a3cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <!-- arcane glow behind both items -->
  <circle cx="256" cy="276" r="190" fill="url(#arcane)"/>

  <g transform="translate(0,26)">
  <!-- baguette (left), tilted -->
  <ellipse cx="176" cy="356" rx="96" ry="16" fill="#000000" opacity="0.35"/>
  <g transform="rotate(-40 176 276)">
    <rect x="48" y="242" width="256" height="68" rx="34" fill="#f2b866" opacity="0.45" filter="url(#glow)"/>
    <rect x="48" y="242" width="256" height="68" rx="34" fill="url(#crust)" stroke="#7a4417" stroke-width="5"/>
    <g fill="none" stroke="#fde2b0" stroke-width="9" stroke-linecap="round">
      <path d="M86 262 q16 6 30 22"/>
      <path d="M134 258 q16 6 30 24"/>
      <path d="M182 258 q16 6 30 24"/>
      <path d="M230 258 q16 6 30 22"/>
    </g>
    <path d="M70 298 H282" fill="none" stroke="#7a4417" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- water drop (right) -->
  <path d="M352 132 C352 132 432 226 432 282 A80 80 0 0 1 272 282 C272 226 352 132 352 132 Z" fill="#4fb4ff" opacity="0.5" filter="url(#glow)"/>
  <path d="M352 132 C352 132 432 226 432 282 A80 80 0 0 1 272 282 C272 226 352 132 352 132 Z" fill="url(#water)" stroke="#d7f3ff" stroke-width="5"/>
  <path d="M318 270 Q318 236 338 210" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="12" stroke-linecap="round"/>
  <circle cx="320" cy="300" r="7" fill="#ffffff" opacity="0.75"/>

  </g>

  <!-- arcane sparkles -->
  <path d="M248 112 l9 24 l24 9 l-24 9 l-9 24 l-9 -24 l-24 -9 l24 -9 Z" fill="#e7d4ff"/>
  <path d="M110 150 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 Z" fill="#c79bff"/>
  <path d="M420 394 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 Z" fill="#c79bff"/>
  <circle cx="300" cy="400" r="6" fill="#e7d4ff"/>
  <circle cx="200" cy="120" r="5" fill="#e7d4ff" opacity="0.8"/>
</svg>
